  <text x="600" y="28" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#9AA5CE">ktk.ts — TypeScript</text>
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16">
    <text x="36" y="76" fill="#9AA5CE"><tspan fill="#7AA2F7">$</tspan> cat ktk.ts</text>
    <text x="36" y="104" fill="#9AA5CE">{</text><text x="36" y="132"><tspan fill="#7DCFFF" dx="20">name</tspan><tspan fill="#9AA5CE">: </tspan><tspan fill="#7AA2F7">"Kiattikhun Rodeam"</tspan><tspan fill="#9AA5CE">,</tspan></text><text x="36" y="160"><tspan fill="#7DCFFF" dx="20">role</tspan><tspan fill="#9AA5CE">: </tspan><tspan fill="#7AA2F7">"Software Developer"</tspan><tspan fill="#9AA5CE">,</tspan></text><text x="36" y="188"><tspan fill="#7DCFFF" dx="20">company</tspan><tspan fill="#9AA5CE">: </tspan><tspan fill="#7AA2F7">"@SAMMAKORN"</tspan><tspan fill="#9AA5CE">,</tspan></text><text x="36" y="216"><tspan fill="#7DCFFF" dx="20">base</tspan><tspan fill="#9AA5CE">: </tspan><tspan fill="#7AA2F7">"Bangkok, Thailand"</tspan><tspan fill="#9AA5CE">,</tspan></text><text x="36" y="244"><tspan fill="#7DCFFF" dx="20">focus</tspan><tspan fill="#9AA5CE">: </tspan><tspan fill="#9AA5CE">[<tspan fill="#7AA2F7">"agentic AI"</tspan>, <tspan fill="#7AA2F7">"ERP integration"</tspan>, <tspan fill="#7AA2F7">"BI dashboards"</tspan>, <tspan fill="#7AA2F7">"LINE bots"</tspan>, <tspan fill="#7AA2F7">"internal tools"</tspan>]</tspan><tspan fill="#9AA5CE">,</tspan></text><text x="36" y="272"><tspan fill="#7DCFFF" dx="20">ai</tspan><tspan fill="#9AA5CE">: </tspan><tspan fill="#9AA5CE">[<tspan fill="#7AA2F7">"Hermes Agent"</tspan>, <tspan fill="#7AA2F7">"Claude"</tspan>, <tspan fill="#7AA2F7">"MCP"</tspan>, <tspan fill="#7AA2F7">"Ollama"</tspan>]</tspan><tspan fill="#9AA5CE">,</tspan></text><text x="36" y="300"><tspan fill="#7DCFFF" dx="20">erp</tspan><tspan fill="#9AA5CE">: </tspan><tspan fill="#9AA5CE">[<tspan fill="#7AA2F7">"Epicor ERP"</tspan>, <tspan fill="#7AA2F7">"Dynamics 365 BC"</tspan>, <tspan fill="#7AA2F7">"Power BI"</tspan>]</tspan><tspan fill="#9AA5CE">,</tspan></text><text x="36" y="328"><tspan fill="#7DCFFF" dx="20">cloud</tspan><tspan fill="#9AA5CE">: </tspan><tspan fill="#9AA5CE">[<tspan fill="#7AA2F7">"AWS"</tspan>, <tspan fill="#7AA2F7">"Azure"</tspan>, <tspan fill="#7AA2F7">"Docker"</tspan>, <tspan fill="#7AA2F7">"Coolify"</tspan>]</tspan><tspan fill="#9AA5CE">,</tspan></text><text x="36" y="356"><tspan fill="#7DCFFF" dx="20">code</tspan><tspan fill="#9AA5CE">: </tspan><tspan fill="#9AA5CE">[<tspan fill="#7AA2F7">"C# / .NET"</tspan>, <tspan fill="#7AA2F7">"TypeScript"</tspan>, <tspan fill="#7AA2F7">"Node.js"</tspan>, <tspan fill="#7AA2F7">"React / Next.js"</tspan>, <tspan fill="#7AA2F7">"Python"</tspan>]</tspan><tspan fill="#9AA5CE">,</tspan></text><text x="36" y="384"><tspan fill="#7DCFFF" dx="20">motto</tspan><tspan fill="#9AA5CE">: </tspan><tspan fill="#7AA2F7">"Automate the boring. Ship the useful."</tspan><tspan fill="#9AA5CE"></tspan></text><text x="36" y="412" fill="#9AA5CE">}</text><text x="36" y="446" fill="#9AA5CE"><tspan fill="#7AA2F7">$</tspan> _<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/></text>
